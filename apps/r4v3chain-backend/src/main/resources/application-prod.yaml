logging:
  level:
    root: INFO
    io.r4v3chain: INFO

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
  error:
    include-message: always

spring:
  jpa:
    open-in-view: false

m4t3r:
  rewards:
    path: ${M4T3R_REWARDS_PATH:/app/data/m4t3r-rewards.json}

r4v3chain:
  persistence:
    mode: postgres
  chain:
    allow-server-evm-wallet-create: false
  auth:
    jwt-secret: ${R4V3CHAIN_JWT_SECRET:}
    bootstrap-admin-username: ${R4V3CHAIN_BOOTSTRAP_ADMIN:}
  product:
    commercial: true
    allow-legacy-private-key: false
    allow-server-wallet-create: false
    faucet-enabled: true
    showcase-enabled: true
    legacy-api-aliases-enabled: true
  security:
    strict-pending-signatures: true
  ops:
    restrict-actuator: true
    actuator-token: ${R4V3CHAIN_ACTUATOR_TOKEN:}
  oauth:
    dev-mock-enabled: false
    backend-base-url: ${OAUTH_BACKEND_BASE_URL:}
    frontend-callback-url: ${OAUTH_FRONTEND_CALLBACK_URL:}
    google:
      enabled: ${OAUTH_GOOGLE_ENABLED:false}
      client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
    meta:
      enabled: ${OAUTH_META_ENABLED:false}
      client-id: ${OAUTH_META_CLIENT_ID:}
      client-secret: ${OAUTH_META_CLIENT_SECRET:}
    apple:
      enabled: ${OAUTH_APPLE_ENABLED:false}
      client-id: ${OAUTH_APPLE_CLIENT_ID:}
      team-id: ${OAUTH_APPLE_TEAM_ID:}
      key-id: ${OAUTH_APPLE_KEY_ID:}
      private-key: ${OAUTH_APPLE_PRIVATE_KEY:}
    microsoft:
      enabled: ${OAUTH_MICROSOFT_ENABLED:false}
      client-id: ${OAUTH_MICROSOFT_CLIENT_ID:}
      client-secret: ${OAUTH_MICROSOFT_CLIENT_SECRET:}
    github:
      enabled: ${OAUTH_GITHUB_ENABLED:false}
      client-id: ${OAUTH_GITHUB_CLIENT_ID:}
      client-secret: ${OAUTH_GITHUB_CLIENT_SECRET:}
    x:
      enabled: ${OAUTH_X_ENABLED:false}
      client-id: ${OAUTH_X_CLIENT_ID:}
      client-secret: ${OAUTH_X_CLIENT_SECRET:}
    discord:
      enabled: ${OAUTH_DISCORD_ENABLED:false}
      client-id: ${OAUTH_DISCORD_CLIENT_ID:}
      client-secret: ${OAUTH_DISCORD_CLIENT_SECRET:}
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
      - https://localhost:*
      - https://127.0.0.1:*
      - https://r4v3chain.pages.dev
      - https://*.r4v3chain.pages.dev
      - https://*.workers.dev
      - https://*.*.workers.dev
      - ${R4V3CHAIN_CORS_EXTRA:https://r4v3zvz01-tagname.onrender.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
