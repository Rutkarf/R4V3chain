# Déploiement prod = Cloudflare Pages (build Git natif sur push main → Rutkarf/r4v3chain).
# Ce workflow ne sert qu'à un upload manuel via wrangler pages deploy.
name: Cloudflare Pages Deploy (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/r4v3chain-frontend/R4V3/package-lock.json
      - name: Build frontend
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://r4v3chain-backend-1-0-0.onrender.com' }}
          SHOWCASE_ENABLED: ${{ vars.SHOWCASE_ENABLED || 'true' }}
        run: bash scripts/cloudflare-build.sh
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/cloudflare-deploy.sh
